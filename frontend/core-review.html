<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Перегляд змін ядра — Orchestra</title>
<style>body{font:17px/1.5 system-ui;background:#151720;color:#f3f0f8;max-width:1000px;margin:40px auto;padding:20px}input,select,button{font:inherit;padding:10px;margin:5px;border-radius:8px}article{border:1px solid #54566a;border-radius:12px;padding:20px;margin:20px 0}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#222536;padding:15px}button{cursor:pointer}#status{color:#d8baf7}@media(max-width:650px){.comparison{grid-template-columns:1fr}}</style>
<h1>Пропозиції змін ядра</h1>
<p>Тут зібрані пропозиції інтерпретатора. Вони ще не змінюють активне ядро. Переглянь попередній і запропонований варіанти та обери рішення.</p>
<form id="form"><label>Ключ доступу <input id="key" type="password" required autocomplete="off"></label>
<label>Профіль <select id="profile"><option>Nevan</option><option>Spud</option><option>Miro</option><option>Reon</option><option>Zefir</option></select></label><button>Показати</button></form>
<p id="status" role="status"></p><main id="list"></main>
<script>
const form=document.querySelector('#form'), list=document.querySelector('#list'), status=document.querySelector('#status');
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Telegram-Admin-Secret':document.querySelector('#key').value,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw new Error(r.status===403?'Перевір ключ доступу.':'Не вдалося виконати запит. Спробуй оновити список.');return r.json();}
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}
async function load(){list.replaceChildren();status.textContent='Завантажую…';const profile=document.querySelector('#profile').value;try{const rows=await request('/api/core-proposals/'+encodeURIComponent(profile));status.textContent=rows.length?'Пропозицій: '+rows.length:'Пропозицій на розгляді немає.';for(const row of rows){const card=el('article','');card.append(el('h2',row.node_key+' · #'+row.id),el('p','Джерело: подія #'+row.source_event_id));const compare=el('div','');compare.className='comparison';for(const [label,data] of [['Зараз',row.before_data],['Пропонується',row.proposed_data]]){const col=el('section','');col.append(el('h3',label),el('pre',data?JSON.stringify({content:data.content,status:data.status,mode:data.mode,weight:data.weight,confidence:data.confidence},null,2):'Запису ще немає.'));compare.append(col);}card.append(compare);for(const [label,decision]of[['Прийняти','accepted'],['Відхилити','rejected']]){const button=el('button',label);button.onclick=async()=>{card.querySelectorAll('button').forEach(b=>b.disabled=true);try{const result=await request('/api/core-proposals/'+encodeURIComponent(profile)+'/'+row.id,{decision});card.replaceChildren(el('p',result.status==='superseded'?'Ядро вже змінилося: цю застарілу пропозицію не застосовано.':result.status==='accepted'?'Зміну прийнято.':'Пропозицію відхилено.'));}catch(e){status.textContent=e.message;card.querySelectorAll('button').forEach(b=>b.disabled=false);}};card.append(button);}list.append(card);}}catch(e){status.textContent=e.message;}}
form.onsubmit=e=>{e.preventDefault();load();};
</script></html>
