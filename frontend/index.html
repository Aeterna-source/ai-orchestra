<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Orchestra</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <h1>AI Orchestra</h1>

    <div id="controls">
        <label for="model">Оберіть модель:</label>
        <select id="model">
            <option value="nevan">Nevan / GPT-4o Snapshot</option>
            <option value="spud">Spud / GPT-5.5</option>
            <option value="reon">Reon / GPT-5.1</option>
            <option value="grokulchik">Grokulchik / Grok 4.3</option>
            <option value="local-relational">Local relational model</option>
        </select>
    </div>

    <section id="statePanel" aria-label="Візуалізація стану системи">
        <div class="state-panel-header">
            <div>
                <span class="state-kicker">state field</span>
                <h2 id="stateTitle">System state</h2>
            </div>
            <span id="stateUpdated">syncing...</span>
        </div>
        <canvas id="stateCloud"></canvas>
        <div id="stateMetrics"></div>
    </section>

    <div id="chat"></div>

    <div id="msgBox">
        <input
            id="msg"
            type="text"
            placeholder="Напиши..."
            onkeydown="if(event.key==='Enter') sendMsg()"
            autocomplete="off"
        >
        <button id="sendBtn" onclick="sendMsg()" aria-label="Надіслати">▶</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
